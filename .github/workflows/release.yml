name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    strategy:
      matrix:
        variant: [onedir, onefile]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build
        run: python -m PyInstaller --noconfirm os_overlay.spec
        env:
          OS_OVERLAY_ONEFILE: ${{ matrix.variant == 'onefile' && '1' || '0' }}

      - name: Verify the executable
        shell: pwsh
        env:
          # The runner has no interactive desktop, so the overlay is drawn offscreen.
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = if ("${{ matrix.variant }}" -eq "onefile") {
            "dist\os-overlay-onefile\os-overlay.exe"
          } else {
            "dist\os-overlay-onedir\os-overlay.exe"
          }
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Write-Error "The self test failed with exit code $($process.ExitCode)"
            exit 1
          }

      - name: Package
        shell: pwsh
        run: |
          $version = if ("${{ matrix.variant }}" -eq "onefile") {
            "os-overlay-onefile"
          } else {
            "os-overlay-onedir"
          }
          $staging = "release\$version"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          if ("${{ matrix.variant }}" -eq "onefile") {
            Copy-Item "dist\os-overlay-onefile\os-overlay.exe" $staging
          } else {
            Copy-Item "dist\os-overlay-onedir\*" $staging -Recurse
          }
          Compress-Archive -Path "$staging\*" -DestinationPath "release\$version.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.variant }}
          path: release/${{ matrix.variant }}.zip

  publish:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: os-overlay ${{ inputs.tag || github.ref_name }}
          body: |
            Download the archive for your preferred layout.

            - `os-overlay-onedir.zip` starts faster and is easier to inspect.
            - `os-overlay-onefile.zip` contains a single executable.
          files: |
            artifacts/*.zip
