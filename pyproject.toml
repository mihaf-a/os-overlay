[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "os-overlay"
description = "A lightweight, highly customizable desktop crosshair overlay for Windows."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "os-overlay contributors" }]
keywords = ["crosshair", "overlay", "gaming", "pyside6", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: Games/Entertainment :: First Person Shooters",
]
dependencies = ["PySide6>=6.7,<7"]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["pyinstaller>=6.6", "ruff>=0.6", "pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/mihaf-a/os-overlay"
Repository = "https://github.com/mihaf-a/os-overlay"
Issues = "https://github.com/mihaf-a/os-overlay/issues"

[project.scripts]
os-overlay = "os_overlay.__main__:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "os_overlay.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
os_overlay = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
    "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"